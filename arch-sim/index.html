<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arch Bridge Stress</title>

<style>
:root{--bg:#eef2f2;--ink:#22303a;--mute:#5d6b74;--acc:#2f6b72}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif}
.app{display:grid;grid-template-rows:auto 1fr;gap:18px;padding:18px 22px 22px;height:100vh;min-height:620px}
.side{display:grid;grid-template-columns:auto minmax(180px,1fr) auto;align-items:center;column-gap:32px;row-gap:16px;width:max-content;max-width:100%;margin:0 auto}
.arches{grid-column:1/-1;grid-row:1;justify-self:center}
.side .views{grid-column:1;grid-row:2}
.side .legend{grid-column:2;grid-row:2;justify-self:center;width:100%;max-width:320px}
#vehs{grid-column:3;grid-row:2;justify-self:end}
.arches{display:grid;grid-template-columns:repeat(12,76px);gap:2px 6px}
.row{display:flex;gap:14px;align-items:flex-end}
button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0;position:relative}
button:focus{outline:none}
.pick{opacity:.3;transition:opacity .15s}
.pick:hover{opacity:.62}
.pick.on{opacity:1}
.pick:focus-visible{opacity:.85}
.pick:focus-visible::after{content:'';position:absolute;left:50%;bottom:-7px;width:18px;height:2px;margin-left:-9px;border-radius:1px;background:var(--acc)}
@media (prefers-reduced-motion:reduce){.pick{transition:none}}
.ar{font-size:11.5px;line-height:1.25;text-align:center;white-space:nowrap}
.ar svg{display:block;margin:0 auto 1px}
.ar svg path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.ar svg path.gl{stroke:var(--mute);stroke-width:1;opacity:.5}
.ar .ko{display:block;font-size:10.5px;line-height:1.15}
.ar.on{font-weight:600}
.vw svg{display:block;width:40px;height:38px}
.views{gap:18px}
.vh{display:flex;flex-direction:column;align-items:center;font-size:11.5px;gap:2px}
.vh svg{display:block;width:64px;height:31px}
#vehs{gap:22px}
.vh.on{font-weight:600}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#E7ECEE;min-height:420px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#c2d{display:none}
.legend{width:220px;font-size:12px;color:var(--mute)}
.legend .bar{height:9px;border-radius:5px;background:linear-gradient(90deg,#2c7bb6,#7fbfdc,#ffffbf,#fdae61,#d7191c)}
.legend .lb{display:flex;justify-content:space-between;margin-top:5px}
.legend b{color:var(--ink);font-weight:600}
.cap{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:12.5px;color:#33424c;text-shadow:0 0 6px rgba(255,255,255,.9)}
.play{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 10px rgba(20,40,50,.18)}
.play:hover{background:#fff}
#vehs{align-items:center}
#vehs .play{position:static;transform:none;width:40px;height:40px;background:#fff;box-shadow:0 1px 4px rgba(20,40,50,.16)}
.play:focus-visible{box-shadow:0 0 0 3px rgba(47,107,114,.45),0 2px 10px rgba(20,40,50,.18)}
.play .i-play{display:none} .play.paused .i-play{display:block} .play.paused .i-pause{display:none}
@media (max-width:1099px){.arches{grid-template-columns:repeat(6,76px)}}
@media (max-width:759px){
  .app{height:auto;padding:16px;gap:16px}
  .arches{grid-template-columns:repeat(4,76px)}
  .stage{height:64vh}
}
@media (max-width:519px){
  .side{grid-template-columns:auto 1fr auto;width:100%;column-gap:12px}
  .side .legend{grid-column:1/-1;grid-row:2;max-width:none}
  .side .views{grid-row:3}
  #vehs{grid-row:3}
}
@media (max-width:359px){.arches{grid-template-columns:repeat(3,76px)}}
</style>

<body>
<div class="app">
  <aside class="side">
    <div class="arches" id="arches"></div>
    <div class="row views">
      <button class="vw pick on" data-v="3d" title="입체" aria-label="입체" aria-pressed="true"><svg width="34" height="32" viewBox="0 0 34 30"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M17 3 L30 9 L30 22 L17 28 L4 22 L4 9 Z"/><path d="M4 9 L17 15 L30 9 M17 15 L17 28"/></g></svg></button>
      <button class="vw pick" data-v="sec" title="단면" aria-label="단면" aria-pressed="false"><svg width="34" height="32" viewBox="0 0 34 30"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9 H31"/><path d="M6 9 V6 M28 9 V6"/><rect x="7" y="9" width="20" height="7" fill="currentColor" fill-opacity=".15"/><rect x="5" y="16" width="24" height="9" fill="currentColor" fill-opacity=".35"/></g><rect x="13" y="3" width="8" height="5" rx="1" fill="currentColor"/></svg></button>
      <button class="vw pick" data-v="side" title="옆" aria-label="옆" aria-pressed="false"><svg width="34" height="32" viewBox="0 0 34 30"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 10 H32"/><path d="M5 28 Q5 13 17 13 Q29 13 29 28"/></g><g fill="currentColor"><rect x="13" y="4.5" width="9" height="3.5" rx="1"/><rect x="18" y="2.5" width="4" height="3" rx=".8"/><circle cx="15" cy="8.3" r="1.3"/><circle cx="20.5" cy="8.3" r="1.3"/></g></svg></button>
    </div>
    <div class="row" id="vehs"></div>

  </aside>
  <main class="stage" id="stage">
    <canvas id="c3d"></canvas><canvas id="c2d"></canvas>

      <svg class="i-play" width="18" height="18" viewBox="0 0 18 18"><path d="M5 2.5 L15.5 9 L5 15.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
  </main>
</div>
<script>
// Arch geometry + thrust-line solver. Span normalized: supports near x=-1 and x=1.
const N = 360;

function arcPts(cx, cy, r, a0, a1, n) {
  const p = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n;
    p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return p;
}
function fnPts(f, x0, x1, n) {
  const p = [];
  for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; p.push([x, f(x)]); }
  return p;
}
function mirror(left) { // left half ends at x=0 apex; mirror to make full arch
  const right = left.slice(0, -1).reverse().map(([x, y]) => [-x, y]);
  return left.concat(right);
}
function concat(...parts) {
  const out = [];
  parts.forEach((p, k) => out.push(...(k ? p.slice(1) : p)));
  return out;
}
function circle3(p1, p2, p3) {
  const [ax, ay] = p1, [bx, by] = p2, [cx, cy] = p3;
  const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
  const ux = ((ax * ax + ay * ay) * (by - cy) + (bx * bx + by * by) * (cy - ay) + (cx * cx + cy * cy) * (ay - by)) / d;
  const uy = ((ax * ax + ay * ay) * (cx - bx) + (bx * bx + by * by) * (ax - cx) + (cx * cx + cy * cy) * (bx - ax)) / d;
  return [ux, uy, Math.hypot(ax - ux, ay - uy)];
}
// resample polyline to n equal-arc-length points
function resample(p, n = N) {
  const L = [0];
  for (let i = 1; i < p.length; i++) L.push(L[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
  const tot = L[L.length - 1], out = [];
  let j = 0;
  for (let k = 0; k <= n; k++) {
    const s = tot * k / n;
    while (j < L.length - 2 && L[j + 1] < s) j++;
    const t = (s - L[j]) / ((L[j + 1] - L[j]) || 1);
    out.push([p[j][0] + t * (p[j + 1][0] - p[j][0]), p[j][1] + t * (p[j + 1][1] - p[j][1])]);
  }
  return out;
}
function foil(k, amp, eps = 0.3) { // lobed semicircle; cusps rounded with a smooth |x|
  const p = [], sa = x => Math.sqrt(x * x + eps * eps) - eps, nrm = sa(1);
  for (let i = 0; i <= 1200; i++) {
    const th = Math.PI - Math.PI * i / 1200;
    const r = 1 - amp + amp * sa(Math.sin(k * th)) / nrm;
    p.push([r * Math.cos(th), r * Math.sin(th)]);
  }
  const s = 1 / Math.abs(p[0][0]);
  return p.map(([x, y]) => [x * s, y * s]);
}
function bez(P0, P1, P2, P3, n = 80) {
  const p = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    p.push([0, 1].map(d => u*u*u*P0[d] + 3*u*u*t*P1[d] + 3*u*t*t*P2[d] + t*t*t*P3[d]));
  }
  return p;
}
function catenaryA(h) { // solve a(cosh(1/a)-1)=h
  let lo = 0.05, hi = 50;
  for (let i = 0; i < 100; i++) { const m = (lo + hi) / 2; (m * (Math.cosh(1 / m) - 1) > h ? lo = m : hi = m); }
  return (lo + hi) / 2;
}

const ARCHES = {
  semicircular: { ko: '반원 아치', en: 'Semicircular', eq: 'x² + y² = 1  (원의 방정식)',
    build: () => arcPts(0, 0, 1, Math.PI, 0, 400) },
  horseshoe: { ko: '말굽 아치', en: 'Horseshoe', eq: 'x² + (y − 0.4)² = 1.16  (반원보다 큰 원호)',
    build: () => { const r = Math.hypot(1, 0.4), a = Math.atan2(-0.4, 1); return arcPts(0, 0.4, r, Math.PI - a, a, 400); } },
  segmental: { ko: '분절 아치', en: 'Segmental', eq: 'x² + (y + 1.05)² = 1.45²  (원의 일부)',
    build: () => { const h = 0.4, r = (1 + h * h) / (2 * h), cy = h - r, a = Math.atan2(-cy, 1); return arcPts(0, cy, r, Math.PI - a, a, 400); } },
  ogee: { ko: '오지 아치', en: 'Ogee', eq: '볼록 곡선 + 오목 곡선 (S자, 베지어 곡선)',
    build: () => mirror(concat(bez([-1, 0], [-1, 0.45], [-0.85, 0.7], [-0.5, 0.78]), bez([-0.5, 0.78], [-0.15, 0.86], [0, 1.0], [0, 1.3]))) },
  gothic: { ko: '고딕 아치', en: 'Gothic', eq: '(x − 1)² + y² = 4  와  (x + 1)² + y² = 4  (원호 2개)',
    build: () => mirror(arcPts(1, 0, 2, Math.PI, 2 * Math.PI / 3, 200)) },
  trefoil: { ko: '삼엽 아치', en: 'Trefoil', eq: 'r = 0.82 + 0.18|sin 3θ|  (극좌표, 꽃잎 3개)',
    build: () => foil(3, 0.18) },
  draped: { ko: '드레이프 아치', en: 'Draped', eq: 'y = 0.8(1 − |x|)²  (가운데로 갈수록 가파른 오목 곡선)',
    build: () => fnPts(x => 0.8 * Math.pow(1 - Math.abs(x), 2), -1, 1, 400) },
  basket: { ko: '바구니 아치', en: 'Basket', eq: '중심이 3개인 원호 (작은 원 2 + 큰 원 1)',
    build: () => {
      const h = 0.6, r1 = 0.45; const R = (Math.pow(1 - r1, 2) + h * h - r1 * r1) / (2 * (h - r1)); const yc = h - R;
      const c1 = [-(1 - r1), 0]; const ang = Math.atan2(c1[1] - yc, c1[0] - 0); // direction from big center to small center
      const left = concat(arcPts(c1[0], c1[1], r1, Math.PI, ang, 120), arcPts(0, yc, R, ang, Math.PI / 2, 200));
      return mirror(left);
    } },
  tudor: { ko: '튜더 아치', en: 'Tudor', eq: '중심이 4개인 원호 (작은 원 2 + 큰 원 2, 뾰족)',
    build: () => {
      const r1 = 0.35, R2 = 2.0, th = Math.PI / 3; const c1 = [-1 + r1, 0];
      const a1 = Math.PI - th; const P1 = [c1[0] + r1 * Math.cos(a1), r1 * Math.sin(a1)];
      const u = [Math.cos(a1), Math.sin(a1)]; const c2 = [P1[0] - R2 * u[0], P1[1] - R2 * u[1]];
      const phiEnd = Math.acos(-c2[0] / R2);
      return mirror(concat(arcPts(c1[0], 0, r1, Math.PI, a1, 100), arcPts(c2[0], c2[1], R2, a1, phiEnd, 200)));
    } },
  parabolic: { ko: '포물선 아치', en: 'Parabolic', eq: 'y = 1.5(1 − x²)  (이차함수)',
    build: () => fnPts(x => 1.5 * (1 - x * x), -1, 1, 400) },
  rampant: { ko: '램펀트 아치', en: 'Rampant', eq: '양 끝 높이가 다른 원호 (세 점을 지나는 원)',
    build: () => { const [cx, cy, r] = circle3([-1, 0], [0.1, 1.0], [1, 0.6]); return arcPts(cx, cy, r, Math.atan2(0 - cy, -1 - cx), Math.atan2(0.6 - cy, 1 - cx), 400); } },
  multifoil: { ko: '다엽 아치', en: 'Multifoil', eq: 'r = 0.9 + 0.1|sin 7θ|  (극좌표, 꽃잎 7개)',
    build: () => foil(7, 0.1) },
  catenary: { ko: '현수선 아치', en: 'Catenary', eq: 'y = a(cosh(1/a) − cosh(x/a))  (쇠사슬 곡선 뒤집기)', extra: true,
    build: (h = 1) => { const a = catenaryA(h); return fnPts(x => a * (Math.cosh(1 / a) - Math.cosh(x / a)), -1, 1, 400); } },
};
function optArch(n, h) { return fnPts(x => h * (1 - Math.pow(Math.abs(x), n)), -1, 1, 400); }

// loads: {self:1, deck:q, mode:'none'|'uniform'|'left'|'point', pointX, pointP}
function solve(rawPts, load) {
  const P = resample(rawPts);
  const n = P.length - 1;
  const A = P[0], B = P[n];
  const wx = [], w = [];
  for (let k = 0; k < n; k++) {
    const [x0, y0] = P[k], [x1, y1] = P[k + 1];
    const len = Math.hypot(x1 - x0, y1 - y0), dx = Math.abs(x1 - x0);
    const mx = (x0 + x1) / 2;
    let wk = load.self * len;
    if (load.mode === 'uniform') wk += load.deck * dx;
    if (load.mode === 'left' && mx < 0) wk += load.deck * dx * 2;
    wx.push(mx); w.push(wk);
  }
  if (load.mode === 'point') { // put point load on nearest segment by x (topmost)
    let best = 0, by = -1e9;
    for (let k = 0; k < n; k++) if (Math.abs(wx[k] - load.pointX) < 0.02 && P[k][1] > by) { by = P[k][1]; best = k; }
    if (by === -1e9) { let d = 1e9; for (let k = 0; k < n; k++) { const dd = Math.abs(wx[k] - load.pointX); if (dd < d) { d = dd; best = k; } } }
    w[best] += load.pointP;
  }
  // prefix sums
  const W = [0], WX = [0];
  for (let k = 0; k < n; k++) { W.push(W[k] + w[k]); WX.push(WX[k] + w[k] * wx[k]); }
  const Wt = W[n], WXt = WX[n];
  const sumBx = WXt - B[0] * Wt; // Σ w_i (x_i − xB)
  function evalH(H, keep) {
    const VA = ((A[1] - B[1]) * H + sumBx) / (A[0] - B[0]);
    let maxd = 0; const thrust = keep ? [A.slice()] : null; const dev = keep ? [0] : null;
    for (let k = 1; k < n; k++) {
      const [xP, yP] = P[k];
      const M = (A[0] - xP) * VA - (A[1] - yP) * H - (WX[k] - xP * W[k]);
      const Rx = H, Ry = VA - W[k];
      const R2 = Rx * Rx + Ry * Ry; const d = Math.abs(M) / Math.sqrt(R2);
      if (d > maxd) maxd = d;
      if (keep) { thrust.push([xP + M / R2 * Ry, yP - M / R2 * Rx]); dev.push(d); }
    }
    if (keep) { thrust.push(B.slice()); dev.push(0); }
    return keep ? { maxd, thrust, dev, VA } : maxd;
  }
  // search H on log scale then golden refine
  let bestH = 1, bestD = Infinity;
  for (let i = 0; i <= 160; i++) {
    const H = Wt * Math.pow(10, -2.5 + 4.5 * i / 160);
    const d = evalH(H); if (d < bestD) { bestD = d; bestH = H; }
  }
  let lo = bestH / 1.08, hi = bestH * 1.08;
  for (let i = 0; i < 50; i++) {
    const m1 = lo + (hi - lo) * 0.382, m2 = lo + (hi - lo) * 0.618;
    if (evalH(m1) < evalH(m2)) hi = m2; else lo = m1;
  }
  bestH = (lo + hi) / 2;
  const r = evalH(bestH, true);
  const height = Math.max(...P.map(p => p[1]));
  const spanW = Math.abs(B[0] - A[0]);
  return { pts: P, H: bestH, W: Wt, height, span: spanW, maxDev: r.maxd, devPct: r.maxd / spanW * 100, thrust: r.thrust, dev: r.dev, loads: { wx, w } };
}

function optimize(h, load) {
  const curve = [];
  let best = null;
  for (let n = 1.0; n <= 4.0001; n += 0.05) {
    const r = solve(optArch(n, h), load);
    curve.push([n, r.devPct]);
    if (!best || r.devPct < best.devPct) best = { n, devPct: r.devPct };
  }
  return { curve, best };
}

if (typeof module !== 'undefined') module.exports = { ARCHES, solve, optimize, optArch };
// normals from a short window so thick bands never fold at tight lobes/cusps
const NW = 8;
function normalsW(P) {
  const n = P.length - 1;
  return P.map((p, i) => { const a = P[Math.max(0, i - NW)], b = P[Math.min(n, i + NW)]; const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [-dy / L, dx / L]; });
}
// Bridge load model: arch self-weight per arc length (a), deck+columns per horizontal length (d), car spread over [cx-cl/2, cx+cl/2] (P).
function solveBridge(P0, ld) {
  const P = resample(P0);
  const n = P.length - 1, A = P[0], B = P[n];
  const wx = [], w = [];
  const xmin = Math.min(...P.map(p => p[0])), xmax = Math.max(...P.map(p => p[0]));
  // deck/car loads go to the topmost arch segment at each x: mark top segments
  const top = new Array(n).fill(false);
  const bins = 200, bi = new Array(bins).fill(-1), by = new Array(bins).fill(-1e9);
  for (let k = 0; k < n; k++) {
    const mx = (P[k][0] + P[k + 1][0]) / 2, my = (P[k][1] + P[k + 1][1]) / 2;
    const b = Math.min(bins - 1, Math.max(0, Math.floor((mx - xmin) / (xmax - xmin) * bins)));
    if (my > by[b]) { by[b] = my; bi[b] = k; }
  }
  bi.forEach(k => { if (k >= 0) top[k] = true; });
  // scale top-segment dx so total horizontal coverage equals span
  let cover = 0; for (let k = 0; k < n; k++) if (top[k]) cover += Math.abs(P[k + 1][0] - P[k][0]);
  const sc = (xmax - xmin) / (cover || 1);
  for (let k = 0; k < n; k++) {
    const [x0, y0] = P[k], [x1, y1] = P[k + 1];
    const len = Math.hypot(x1 - x0, y1 - y0), mx = (x0 + x1) / 2;
    let wk = ld.a * len;
    if (top[k]) {
      const dx = Math.abs(x1 - x0) * sc;
      wk += ld.d * dx;
      if (ld.car) { const lo = Math.max(Math.min(x0, x1), ld.cx - ld.cl / 2), hi = Math.min(Math.max(x0, x1), ld.cx + ld.cl / 2); if (hi > lo) wk += ld.P / ld.cl * (hi - lo) * sc; }
    }
    wx.push(mx); w.push(wk);
  }
  const W = [0], WX = [0];
  for (let k = 0; k < n; k++) { W.push(W[k] + w[k]); WX.push(WX[k] + w[k] * wx[k]); }
