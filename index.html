<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rcchoi — Apps</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0f19;
    color: #f3f4f6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 560px; width: 100%; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  p.tag { color: #8b949e; margin: 0 0 32px; }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 4px; font-size: 20px; }
  .card p { margin: 0 0 14px; color: #9aa4b2; font-size: 15px; line-height: 1.5; }
  .links a {
    display: inline-block;
    margin-right: 14px;
    color: #79c0ff;
    text-decoration: none;
    font-size: 15px;
  }
  .links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Apps</h1>
  <p class="tag">Support &amp; policies for apps by rcchoi</p>

  <div class="card">
    <h2>CodePad</h2>
    <p>A lightweight code viewer &amp; editor for iOS. Open files right where they live — no copies, no imports.</p>
    <div class="links">
      <a href="codepad/privacy.html">Privacy Policy</a>
      <a href="codepad/support.html">Support</a>
    </div>
  </div>

  <div class="card">
    <h2>Solum</h2>
    <p>On-device LLM chat for iOS. Your conversations never leave your phone.</p>
    <div class="links">
      <a href="solum/privacy.html">Privacy Policy</a>
      <a href="solum/support.html">Support</a>
    </div>
  </div>
</div>
</body>
</html>
